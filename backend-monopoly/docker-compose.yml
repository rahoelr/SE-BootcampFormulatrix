services:
  # Backend API Service
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monopoly-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5000:8080"  # Map container port 8080 to host port 5000
    networks:
      - monopoly-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: monopoly-nginx
    restart: unless-stopped
    ports:
      - "8080:80"  # Expose on port 8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend-api
    networks:
      - monopoly-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monopoly-network:
    driver: bridge

# Optional: Add volume for persistent data if needed in future
# volumes:
#   monopoly-data:
